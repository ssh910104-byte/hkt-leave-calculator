
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKT 연차 계산기</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --accent: #2563eb; --accent-soft: #dbeafe; --green: #166534; --green-soft: #dcfce7;
      --warn: #b45309; --warn-soft: #fef3c7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 1220px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .left-col { display: grid; gap: 18px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04); }
    .card h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; font-weight: 700; margin: 14px 0 8px; }
    input[type="date"] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #fff; }
    .checks { display: grid; gap: 12px; margin-top: 14px; }
    .check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; background: #fff; }
    .check input { margin-top: 4px; }
    .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; }
    .secondary { background: #eef2ff; color: #3730a3; }
    .pill { display: inline-block; border-radius: 999px; padding: 6px 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; margin-bottom: 10px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .metric { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
    .metric .k { color: var(--muted); font-size: 13px; }
    .metric .v { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .tabs { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
    .tab-btn { background:#eef2ff; color:#3730a3; }
    .tab-btn.active { background: var(--accent); color:#fff; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fafafa; }
    .panel-header h3 { margin: 0; font-size: 18px; }
    .badge { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
    .badge.monthly { background: var(--green-soft); color: var(--green); }
    .badge.yearly { background: var(--accent-soft); color: var(--accent); }
    .panel-body { padding: 14px; }
    .table-wrap { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
    th { background: #f9fafb; font-size: 13px; color: var(--muted); position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    .note { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); border: 1px solid #fde68a; font-size: 14px; }
    .note-nowrap { white-space: nowrap; }
    .small { color: var(--muted); font-size: 13px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; background: #fff; margin-top: 14px; }
    ul { margin: 8px 0 0 18px; padding: 0; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .wrap { padding: 14px; } .summary { grid-template-columns: 1fr; } .metric .v { font-size: 24px; } table { font-size: 13px; } th, td { padding: 8px 6px; } }
  
table { table-layout: auto; }
td, th { white-space: nowrap; }
.table-wrap { overflow-x: auto; }

</style>
</head>
<body>
  <div class="wrap">
    <h1>HKT 연차 계산기</h1>
    <div class="sub">현재 기준으로 아직 사용 가능한 월차와 연차만 계산합니다. 소멸된 연차 내역은 &quot;소멸 연차 조회&quot;에서 조회 가능합니다.</div>

    <div class="grid">
      <div class="left-col">
        <div class="card">
          <h2>입력</h2>
          <label for="hireDate">입사일</label>
          <input type="date" id="hireDate" />
          <label for="baseDate">기준일</label>
          <input type="date" id="baseDate" />
          <div class="small">기준일 현재 남아 있는 월차/연차만 표시합니다.</div>

          <div class="btns">
            <button class="primary" id="calcBtn">계산하기</button>
            <button class="secondary" id="todayBtn">기준일 오늘로</button>
          </div>
        </div>

        <div class="note">
          <strong>[안내]</strong>
          <ul>
            <li>월차는 1개월 개근 기준으로 산정하였습니다.</li>
            <li class="note-nowrap">연차는 1년간 80%이상 출근율 기준으로 산정하였습니다.</li>
          </ul>
          <div style="margin-top:8px;">※ 결근, 휴직, 등으로 출근율이 80%미만인 경우는 소속 사업장 담당자에게 문의해 주시기 바랍니다.</div>
        </div>
      </div>

      <div class="card">
        <div class="pill">계산 결과</div>
        <div id="summary" class="summary"></div>
        <div class="tabs">
  <button class="tab-btn active" id="tabCurrentBtn" type="button">현재 사용 가능</button>
  <button class="tab-btn" id="tabExpiredBtn" type="button">소멸 연차 조회</button>
</div>
<div id="resultArea"></div>
      </div>
    </div>
  </div>

  <script>
    function pad(n){ return String(n).padStart(2,'0'); }
    function formatDate(date){ return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`; }
    function parseDate(value){ const [y,m,d] = value.split('-').map(Number); return new Date(y,m-1,d); }
    function addDays(date,days){ const d = new Date(date); d.setDate(d.getDate()+days); return d; }
    function addMonths(date,months){ const d = new Date(date); const originalDay = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+months); const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(originalDay, lastDay)); return d; }
    function addYears(date,years){ const d = new Date(date); const month = d.getMonth(); d.setFullYear(d.getFullYear()+years); if(d.getMonth() !== month) d.setDate(0); return d; }
    function diffDays(a,b){ return Math.floor((b.getTime()-a.getTime())/86400000); }
    function daysInPeriodInclusive(startDate,endDate){ return diffDays(startDate, addDays(endDate,1)); }
    function startOfFiscalYear(year){ return new Date(year,6,1); }
    function firstFiscalGrantOnOrAfter(date){ const y = date.getFullYear(); const fy = startOfFiscalYear(y); return date <= fy ? fy : startOfFiscalYear(y+1); }
    function fiscalUseByFromGrant(grantDate){ return addDays(startOfFiscalYear(grantDate.getFullYear()+1), -1); }
    function completedYearsOn(date, hireDate){ let years = date.getFullYear()-hireDate.getFullYear(); const anniversaryThisYear = addYears(hireDate, years); if(date < anniversaryThisYear) years -= 1; return Math.max(0, years); }
    function leaveDaysAfterFirstYear(completedYears){ if(completedYears < 1) return 0; const extra = completedYears >= 3 ? Math.floor((completedYears - 1)/2) : 0; return Math.min(15 + extra, 25); }
    function ceilHalf(value){ return Math.ceil(value * 2) / 2; }
    function formatDays(value){ const rounded = Math.round(value * 10) / 10; return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1); }
    function sumDays(items){ return items.reduce((sum,e) => sum + e.days, 0); }

    function generateAllLeaveEvents(hireDate, perfectMonthly, over80, baseDate){
      const events = [];
      const firstAnniversary = addYears(hireDate,1);
      const firstFiscalGrant = firstFiscalGrantOnOrAfter(firstAnniversary);
      const firstFiscalUseBy = fiscalUseByFromGrant(firstFiscalGrant);
      const endYear = baseDate.getFullYear() + 1;

      const monthlyEligibleDate = new Date(2018,4,29);
      if(perfectMonthly && hireDate >= monthlyEligibleDate){
        for(let i=1; i<=11; i++){
          const periodStart = addMonths(hireDate, i-1);
          const periodEnd = addDays(addMonths(hireDate, i), -1);
          const grantDate = addMonths(hireDate, i);
          events.push({
            category:'월차', type:'월차', periodStart, periodEnd, grantDate, days:1, useBy:new Date(firstFiscalUseBy)
          });
        }
      }

      if(over80){
        events.push({
          category:'연차', type:'1년차 연차', periodStart:new Date(hireDate), periodEnd:addDays(firstAnniversary,-1),
          grantDate:new Date(firstAnniversary), days:15, useBy:new Date(firstFiscalUseBy)
        });

        const prorateStart = new Date(firstAnniversary);
        const prorateEnd = addDays(firstFiscalGrant, -1);
        const prorateDaysCount = daysInPeriodInclusive(prorateStart, prorateEnd);
        if(prorateDaysCount > 0){
          events.push({
            category:'연차', type:'첫 회계연도 비례연차', periodStart:prorateStart, periodEnd:prorateEnd,
            grantDate:new Date(firstFiscalGrant), days:ceilHalf(15 * prorateDaysCount / 365), useBy:new Date(firstFiscalUseBy)
          });
        }

        for(let year = firstFiscalGrant.getFullYear()+1; year <= endYear; year++){
          const fiscalGrantDate = startOfFiscalYear(year);
          const completedYears = completedYearsOn(fiscalGrantDate, hireDate);
          const days = leaveDaysAfterFirstYear(completedYears);
          if(days > 0){
            events.push({
              category:'연차', type:'회계연도 연차', periodStart:new Date(fiscalGrantDate),
              periodEnd:addDays(startOfFiscalYear(year+1), -1), grantDate:new Date(fiscalGrantDate),
              days, useBy:addDays(startOfFiscalYear(year+1), -1)
            });
          }
        }
      }
      return events.sort((a,b) => a.grantDate - b.grantDate);
    }

    function buildRows(items, label, emptyMessage){
      if(!items.length){
        return `<tr><td colspan="7" style="text-align:center;color:#6b7280;">${emptyMessage || `현재 기준 사용 가능한 ${label}가 없습니다.`}</td></tr>`;
      }
      return items.map((e, idx) => `
        <tr>
          <td>${idx+1}</td>
          <td>${e.type}</td>
          <td>${formatDate(e.periodStart)}</td>
          <td>${formatDate(e.periodEnd)}</td>
          <td>${formatDate(e.grantDate)}</td>
          <td>${formatDate(e.useBy)}</td>
          <td>${formatDays(e.days)}개</td>
        </tr>
      `).join('');
    }

    function render(){
      const hireValue = document.getElementById('hireDate').value;
      const baseValue = document.getElementById('baseDate').value;
      const perfectMonthly = true;
      const over80 = true;
      const summary = document.getElementById('summary');
      const resultArea = document.getElementById('resultArea');

      if(!hireValue || !baseValue){
        summary.innerHTML = '';
        resultArea.innerHTML = '<div class="empty">입사일과 기준일을 입력해 주세요.</div>';
        return;
      }

      const hireDate = parseDate(hireValue);
      const baseDate = parseDate(baseValue);
      if(baseDate < hireDate){
        summary.innerHTML = '';
        resultArea.innerHTML = '<div class="empty">기준일은 입사일보다 빠를 수 없습니다.</div>';
        return;
      }

      const allEvents = generateAllLeaveEvents(hireDate, perfectMonthly, over80, baseDate);
      const accruedEvents = allEvents.filter(e => e.grantDate <= baseDate);
      const currentEvents = accruedEvents.filter(e => e.useBy >= baseDate);
      const expiredEvents = accruedEvents.filter(e => e.useBy < baseDate);

      const monthlyEvents = currentEvents.filter(e => e.category === '월차');
      const yearlyEvents = currentEvents.filter(e => e.category === '연차');
      const expiredMonthlyEvents = expiredEvents.filter(e => e.category === '월차');
      const expiredYearlyEvents = expiredEvents.filter(e => e.category === '연차');

      const totalCurrent = sumDays(currentEvents);
      const monthlyCurrent = sumDays(monthlyEvents);
      const yearlyCurrent = sumDays(yearlyEvents);
      const totalExpired = sumDays(expiredEvents);
      const monthlyExpired = sumDays(expiredMonthlyEvents);
      const yearlyExpired = sumDays(expiredYearlyEvents);

      const tenureDays = diffDays(hireDate, baseDate);
      const tenureYears = (tenureDays / 365.2425).toFixed(2);

      summary.innerHTML = `
        <div class="metric"><div class="k">기준일 현재 사용 가능</div><div class="v">${formatDays(totalCurrent)}일</div></div>
        <div class="metric"><div class="k">현재 사용 가능 월차</div><div class="v">${formatDays(monthlyCurrent)}일</div></div>
        <div class="metric"><div class="k">현재 사용 가능 연차</div><div class="v">${formatDays(yearlyCurrent)}일</div></div>
        <div class="metric"><div class="k">소멸 연차 합계</div><div class="v">${formatDays(totalExpired)}일</div></div>
      `;

      resultArea.innerHTML = `
        <div id="tabCurrent" class="tab-content active">
          <div class="small">재직일수: ${tenureDays}일 / 재직연수(참고): ${tenureYears}년</div>
          <div class="small" style="margin-top:6px;">현재 기준 유효한 항목만 표에 표시됩니다.</div>

          <div class="split">
            <div class="panel">
              <div class="panel-header">
                <h3>현재 사용 가능한 월차</h3>
                <span class="badge monthly">월차 ${formatDays(monthlyCurrent)}일</span>
              </div>
              <div class="panel-body">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>No.</th><th>구분</th><th>시작일</th><th>종료일</th><th>발생일</th><th>사용기한</th><th>월차</th>
                      </tr>
                    </thead>
                    <tbody>${buildRows(monthlyEvents, '월차')}</tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <h3>현재 사용 가능한 연차</h3>
                <span class="badge yearly">연차 ${formatDays(yearlyCurrent)}일</span>
              </div>
              <div class="panel-body">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>No.</th><th>구분</th><th>시작일</th><th>종료일</th><th>발생일</th><th>사용기한</th><th>연차</th>
                      </tr>
                    </thead>
                    <tbody>${buildRows(yearlyEvents, '연차')}</tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="tabExpired" class="tab-content">
          <div class="small">기준일 이전에 이미 사용기한이 지난 항목만 표시됩니다.</div>
          <div class="small" style="margin-top:6px;">소멸 합계: ${formatDays(totalExpired)}일 (월차 ${formatDays(monthlyExpired)}일 / 연차 ${formatDays(yearlyExpired)}일)</div>

          <div class="split">
            <div class="panel">
              <div class="panel-header">
                <h3>소멸된 월차</h3>
                <span class="badge monthly">월차 ${formatDays(monthlyExpired)}일</span>
              </div>
              <div class="panel-body">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>No.</th><th>구분</th><th>시작일</th><th>종료일</th><th>발생일</th><th>사용기한</th><th>월차</th>
                      </tr>
                    </thead>
                    <tbody>${buildRows(expiredMonthlyEvents, '월차', '소멸된 월차가 없습니다.')}</tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <h3>소멸된 연차</h3>
                <span class="badge yearly">연차 ${formatDays(yearlyExpired)}일</span>
              </div>
              <div class="panel-body">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>No.</th><th>구분</th><th>시작일</th><th>종료일</th><th>발생일</th><th>사용기한</th><th>연차</th>
                      </tr>
                    </thead>
                    <tbody>${buildRows(expiredYearlyEvents, '연차', '소멸된 연차가 없습니다.')}</tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      bindTabs();
    }

    function bindTabs(){
      const currentBtn = document.getElementById('tabCurrentBtn');
      const expiredBtn = document.getElementById('tabExpiredBtn');
      const currentTab = document.getElementById('tabCurrent');
      const expiredTab = document.getElementById('tabExpired');
      if(!currentBtn || !expiredBtn || !currentTab || !expiredTab) return;

      currentBtn.onclick = () => {
        currentBtn.classList.add('active');
        expiredBtn.classList.remove('active');
        currentTab.classList.add('active');
        expiredTab.classList.remove('active');
      };
      expiredBtn.onclick = () => {
        expiredBtn.classList.add('active');
        currentBtn.classList.remove('active');
        expiredTab.classList.add('active');
        currentTab.classList.remove('active');
      };
    }

    function todayLocal(){
      const d = new Date();
      return formatDate(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
    }

    document.getElementById('baseDate').value = todayLocal();
    document.getElementById('todayBtn').addEventListener('click', () => {
      document.getElementById('baseDate').value = todayLocal();
      render();
    });
    document.getElementById('calcBtn').addEventListener('click', render);
  </script>
</body>
</html>
